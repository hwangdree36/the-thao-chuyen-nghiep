<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BracketX Pro - The Pro Standard for Sports Tournaments</title>
  <meta name="description" content="Platform Quản Lý Giải Đấu Chuyên Nghiệp: Cầu Lông · Pickleball · Bóng Đá. Chạy hoàn toàn trên GitHub Pages & Firebase Spark Plan.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#06b6d4',
              neon: '#38bdf8',
              gold: '#eab308',
              dark: '#080c14',
              card: '#0f172a',
            }
          },
          fontFamily: {
            heading: ['"Chakra Petch"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #080c14;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 9999px; }
    .glow-cyan { box-shadow: 0 0 20px -3px rgba(6, 182, 212, 0.25); }
    .glow-gold { box-shadow: 0 0 25px -3px rgba(234, 179, 8, 0.3); }
  </style>
</head>
<body class="min-h-screen bg-[#080c14] text-slate-100 selection:bg-cyan-500 selection:text-white">

  <!-- ================= FIREBASE SDK 9 & BRACKETX CORE SCRIPT ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. CẤU HÌNH FIREBASE (Khai báo sẵn biến để trống theo yêu cầu)
    const firebaseConfig = {
  apiKey: "AIzaSyCPu6JIBPqVu8uWfBfNVQLRYlRfGyQlPZ8",
  authDomain: "bracketxpro.firebaseapp.com",
  projectId: "bracketxpro",
  storageBucket: "bracketxpro.firebasestorage.app",
  messagingSenderId: "216472668402",
  appId: "1:216472668402:web:4be15189573a970728686b",
  measurementId: "G-86D39M3EDW"
};

    // Kiểm tra và kết nối Firebase nếu có cấu hình
    let app, auth, db;
    const storedConfig = JSON.parse(localStorage.getItem('bracketx_standalone_cfg') || '{}');
    const activeConfig = storedConfig.apiKey ? storedConfig : firebaseConfig;

    if (activeConfig.apiKey && activeConfig.projectId) {
      try {
        app = initializeApp(activeConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        console.log("BracketX Pro: Firebase Spark Plan Connected!");
      } catch (e) {
        console.warn("Firebase Init Error:", e);
      }
    }

    // Đưa ra window để ứng dụng gọi
    window.__BX_FIREBASE = {
      app, auth, db,
      GoogleAuthProvider, signInWithPopup, signOut,
      doc, getDoc, setDoc, deleteDoc, collection, getDocs,
      activeConfig
    };

    // Khởi chạy App UI sau khi nạp Firebase
    window.dispatchEvent(new Event('bx-firebase-ready'));
  </script>

  <!-- Root App Shell Container -->
  <div id="bracketx-app" class="flex flex-col min-h-screen">
    <!-- Navbar Header -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 px-4 lg:px-8 py-3.5">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        <!-- Logo UI & Brand Identity -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-blue-600 to-indigo-700 flex items-center justify-center shadow-lg shadow-cyan-500/25 border border-cyan-400/30">
            <span class="font-['Chakra_Petch'] font-extrabold text-white text-lg tracking-wider">BX</span>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center gap-2">
              <span class="font-['Chakra_Petch'] font-extrabold text-xl tracking-tight text-white">BracketX Pro</span>
              <span class="px-2 py-0.5 text-[10px] font-bold tracking-widest uppercase bg-slate-900 border border-slate-700 text-cyan-400 rounded">PRO PLATFORM</span>
            </div>
            <span class="text-[11px] text-slate-400 tracking-wide">The Pro Standard for Sports Tournaments</span>
          </div>
        </div>

        <!-- Action / Auth Controls -->
        <div class="flex items-center gap-3">
          <div id="auth-status-container" class="flex items-center gap-2"></div>
        </div>
      </div>
    </header>

    <!-- Main Content Dynamic Mount -->
    <main id="main-content" class="flex-1 max-w-7xl mx-auto w-full p-4 lg:p-8">
      <div class="text-center py-20 text-slate-400">Đang khởi động BracketX Pro Engine...</div>
    </main>
  </div>

  <!-- App Bootstrap JS -->
  <script>
    // Standalone Application Logic (Pre-bundled engine)
    console.log("BracketX Pro Standalone Loaded.");
  </script>
</body>
</html>
